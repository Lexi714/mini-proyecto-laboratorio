name: CI

# Se ejecuta en cada push (a cualquier rama) y en cada Pull Request.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: none

      - name: Obtener la carpeta de cache de Composer
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cachear dependencias
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ matrix.php }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ runner.os }}-${{ matrix.php }}-

      - name: Instalar dependencias
        run: composer install --no-progress --prefer-dist --no-interaction

      - name: Lint (sintaxis y estilo PSR-12)
        run: composer lint

      - name: Pruebas unitarias
        run: vendor/bin/phpunit --testsuite unit

      - name: Pruebas de integracion
        run: vendor/bin/phpunit --testsuite integration
